<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in to save Railway demo bookings."><title>Railway — Sign in</title><link rel="stylesheet" href="./styles.css?v=__RELEASE__"></head><body>
<header class="site-header"><a class="brand" href="./" aria-label="Railway home"><span class="brand-icon">▥</span> railway<span class="brand-dot">.</span></a><span class="header-note">A better way to go places</span><a class="auth-back" href="./">Back to search</a></header>
<main class="auth-main"><section class="auth-card" aria-labelledby="auth-title"><p class="eyebrow"><span></span> ACCOUNT</p><h1 id="auth-title">Welcome to railway<span class="brand-dot">.</span></h1><p class="auth-intro">Sign in before booking a demo ticket. Search trains without an account.</p><div class="auth-tabs" role="tablist"><button type="button" class="auth-tab active" data-auth-mode="login" role="tab" aria-selected="true">Sign in</button><button type="button" class="auth-tab" data-auth-mode="register" role="tab" aria-selected="false">Create account</button></div><form id="auth-form" class="auth-form" novalidate><label id="name-field" hidden>Full name<input id="auth-name" name="name" autocomplete="name" maxlength="60" placeholder="Your name"></label><label>Email address<input id="auth-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="Minimum 8 characters"></label><p id="auth-error" class="auth-error" role="alert" hidden></p><button id="auth-submit" class="auth-submit" type="submit">Sign in</button></form><p class="auth-demo-note">Demo account only. Do not use a real banking password.</p></section></main>
<script type="module" src="./auth.js?v=__RELEASE__"></script></body></html>
