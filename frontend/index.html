<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Search sample Indian train schedules, stops and fares."><title>Railway — Find your next journey</title><link rel="stylesheet" href="./styles.css?v=94c2a4404f55"></head><body>
<header class="site-header"><a class="brand" href="./" aria-label="Railway home"><span class="brand-icon" aria-hidden="true">▥</span> railway<span class="brand-dot">.</span></a><a id="login-link" class="login-link" href="./login.html?next=./">Sign in</a><button type="button" id="logout-button" class="logout-button" hidden>Log out</button><button type="button" id="show-bookings" class="bookings-link" hidden>My bookings</button></header>
<main><section class="hero"><div class="hero-copy"><h1>Find your <em>train.</em></h1><p class="intro">Search routes across India and compare train times and stops.</p></div></section>
<section class="search-panel" aria-labelledby="search-heading"><div class="search-heading"><h2 id="search-heading">Plan your journey</h2></div><form id="search-form" novalidate><div class="station-field"><label for="from">From station</label><div class="input-wrap"><span aria-hidden="true">◎</span><input id="from" list="stations" placeholder="City or station code" autocomplete="off" required></div></div><button class="swap" id="swap" type="button" aria-label="Swap departure and destination stations">⇄</button><div class="station-field destination"><label for="to">To station</label><div class="input-wrap"><span aria-hidden="true">⌖</span><input id="to" list="stations" placeholder="City or station code" autocomplete="off" required></div></div><div class="travel-options" aria-label="Journey options"><fieldset class="trip-type"><legend>Journey type</legend><label><input type="radio" name="trip-type" value="one-way" checked> One way</label><label><input type="radio" name="trip-type" value="round-trip"> Round trip</label></fieldset><label class="date-field" for="travel-date">Travel date<input id="travel-date" type="date" required></label><label class="date-field" id="return-date-field" for="return-date" hidden>Return date<input id="return-date" type="date"></label></div><button class="search-button" type="submit">Search trains <span aria-hidden="true">↗</span></button><datalist id="stations"></datalist></form><p id="form-error" class="form-error" role="alert" hidden></p></section>
<section class="results-section" aria-labelledby="results-title"><div class="results-heading"><div><h2 id="results-title">Train results</h2><p id="results-count" role="status" aria-live="polite"></p></div><div class="sort-control"><label for="sort">Sort by</label><select id="sort"><option value="departure">Departure time</option><option value="duration">Journey duration</option></select></div></div><div id="results"></div></section><section id="bookings-panel" class="bookings-panel" hidden aria-live="polite"><div class="bookings-panel-heading"><div><h2>My bookings</h2></div><button type="button" id="close-bookings" class="close-bookings">Close</button></div><div id="bookings-list"></div></section>
<aside class="demo-notice"><span aria-hidden="true">ⓘ</span><p><strong>Demo schedules.</strong> Check official railway services for current train times.</p></aside>
</main><footer><a class="brand" href="./">railway<span class="brand-dot">.</span></a><span>All times IST</span></footer>
<script type="module" src="./bootstrap.js?v=1cde86182f62"></script></body></html>
