server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-stacktrace: never
spring:
  application:
    name: railway-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/railway;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
railway:
  cors-origins: ${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
