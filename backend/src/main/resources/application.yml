server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-stacktrace: never
spring:
  application:
    name: railway-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/railway}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/mysql
railway:
  cors-origins: ${CORS_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
