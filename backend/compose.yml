services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: railway
      MYSQL_USER: railway
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting}
    volumes:
      - railway-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u railway -D railway -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/railway
      DB_USERNAME: railway
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting}
      SERVER_ADDRESS: 0.0.0.0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  railway-mysql:
